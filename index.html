<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>在日stay🧭代購</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome 圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Noto Sans TC & Noto Serif JP -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+JP:wght@600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; }
        .font-serif-jp { font-family: 'Noto Serif JP', serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    </style>
</head>
<body class="bg-[#FDFBF7] text-[#2C221E] min-h-screen flex flex-col font-sans antialiased">

    <!-- 頂部頁首導覽 -->
    <header class="bg-[#EFE6DC] text-[#2C221E] shadow-sm sticky top-0 z-40 border-b border-[#E3D5C5]">
        <div class="max-w-4xl mx-auto px-4 py-3.5 flex justify-between items-center">
            <h1 class="text-lg sm:text-xl font-bold tracking-wider flex items-center gap-2 font-serif-jp text-[#4A3B32]">
                <i class="fa-solid fa-bread-slice text-[#967259]"></i> <span>在日stay🧭代購</span>
            </h1>
            <div class="flex items-center gap-2">
                <button onclick="toggleCartDrawer()" class="relative p-2 text-[#4A3B32] hover:text-[#967259] transition cursor-pointer">
                    <i class="fa-solid fa-cart-shopping text-xl"></i>
                    <span id="cart-badge" class="absolute -top-1 -right-1 bg-[#967259] text-white text-[10px] font-bold rounded-full w-5 h-5 flex items-center justify-center hidden">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 主內容區域 -->
    <main class="flex-grow max-w-4xl w-full mx-auto p-4 sm:p-6 space-y-6">

        <!-- 買家訂單查詢卡片 -->
        <div class="bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-[#E3D5C5] space-y-3">
            <div class="flex items-center gap-2 text-[#4A3B32] font-bold text-sm sm:text-base font-serif-jp">
                <i class="fa-solid fa-magnifying-glass text-[#967259]"></i> 買家個人訂單狀態查詢
            </div>
            <div class="flex gap-2">
                <input type="text" id="search-nickname" placeholder="請輸入您填單時的 LINE 群組暱稱..." class="flex-grow px-3.5 py-2 border border-[#D7C4B7] rounded-xl text-xs sm:text-sm bg-[#FDFBF7] text-[#2C221E] focus:ring-1 focus:ring-[#967259] focus:outline-none">
                <button onclick="searchCustomerOrders()" class="bg-[#967259] hover:bg-[#634832] text-white px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition whitespace-nowrap cursor-pointer shadow-sm">
                    查詢
                </button>
            </div>
            <div id="customer-orders-result" class="hidden pt-3 border-t border-[#E3D5C5] space-y-3"></div>
        </div>

        <!-- 匯率與對帳提示 -->
        <div class="bg-[#F3E8DB] p-4 rounded-2xl border border-[#D7C4B7] space-y-1.5 text-xs sm:text-sm text-[#4A3B32]">
            <div class="font-bold flex items-center gap-1.5 text-[#967259]">
                <i class="fa-solid fa-circle-info"></i> 開團下單須知
            </div>
            <p>1. 填單完成後請盡速完成預付金額匯款，以利進行後續購買。</p>
            <p>2. 請嚴格遵守各商品之個人限購數量，超過限購數量系統將無法加入購物車。</p>
        </div>

        <!-- 分類篩選選單 -->
        <div id="category-filter-bar" class="flex gap-2 overflow-x-auto no-scrollbar pb-1">
            <button onclick="filterByCategory('ALL')" class="category-btn active px-3.5 py-1.5 rounded-xl text-xs font-bold bg-[#967259] text-white whitespace-nowrap shadow-sm cursor-pointer transition">全部分類</button>
        </div>

        <!-- 商品展示卡片區域 -->
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-6">
            <div class="col-span-full text-center py-12 text-[#A08D7D] text-sm">載入商品中...</div>
        </div>
    </main>

    <!-- 購物車 Drawer / Modal -->
    <div id="cart-drawer" class="fixed inset-0 bg-[#2C221E]/40 backdrop-blur-sm z-50 hidden flex justify-end">
        <div class="bg-[#FDFBF7] w-full max-w-md h-full shadow-2xl flex flex-col border-l border-[#E3D5C5]">
            <div class="p-4 bg-[#EFE6DC] border-b border-[#E3D5C5] flex justify-between items-center">
                <h3 class="font-bold text-base text-[#4A3B32] font-serif-jp flex items-center gap-2">
                    <i class="fa-solid fa-basket-shopping text-[#967259]"></i> 已選購商品
                </h3>
                <button onclick="toggleCartDrawer()" class="text-[#A08D7D] hover:text-[#4A3B32] text-2xl font-bold cursor-pointer">&times;</button>
            </div>

            <!-- 購物車商品列表 -->
            <div id="cart-items-container" class="flex-grow p-4 overflow-y-auto space-y-3"></div>

            <!-- 購物車結帳統計與對帳表單 -->
            <div class="p-4 bg-[#F8F4EE] border-t border-[#E3D5C5] space-y-4">
                <div class="space-y-1.5 text-xs text-[#4A3B32]">
                    <div class="flex justify-between font-bold text-sm">
                        <span>預估商品總金額：</span>
                        <span id="cart-total-amount" class="text-[#967259]">NT$ 0</span>
                    </div>
                    <div class="flex justify-between font-bold text-emerald-800">
                        <span>需先預付(訂金)：</span>
                        <span id="cart-deposit-amount" class="text-emerald-700">NT$ 0</span>
                    </div>
                    <div class="flex justify-between text-[#7D6B5D] text-[11px]">
                        <span>賣貨便抵台尾款：</span>
                        <span id="cart-balance-amount">NT$ 0</span>
                    </div>
                </div>

                <!-- 銀行收款帳號資訊 -->
                <div class="bg-white p-3 rounded-xl border border-[#D7C4B7] space-y-1 text-xs">
                    <div class="font-bold text-[#4A3B32] flex items-center gap-1">
                        <i class="fa-solid fa-building-columns text-[#967259]"></i> 訂金匯款指定帳號：
                    </div>
                    <div id="bank-accounts-info" class="text-[#7D6B5D] space-y-0.5"></div>
                </div>

                <!-- 下單對帳表單 -->
                <form id="checkout-form" class="space-y-2.5">
                    <div>
                        <label class="block text-xs font-bold text-[#4A3B32] mb-1">LINE 群組暱稱 <span class="text-rose-500">*</span></label>
                        <input type="text" id="user-group-nickname" required placeholder="請填寫社群/群組暱稱" class="w-full px-3 py-2 border border-[#D7C4B7] rounded-xl text-xs bg-white focus:ring-1 focus:ring-[#967259] focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-[#4A3B32] mb-1">IG 帳號 (備用聯絡)</label>
                        <input type="text" id="user-social-account" placeholder="例如: @stay_skz" class="w-full px-3 py-2 border border-[#D7C4B7] rounded-xl text-xs bg-white focus:ring-1 focus:ring-[#967259] focus:outline-none">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-bold text-[#4A3B32] mb-1">轉帳戶名 <span class="text-rose-500">*</span></label>
                            <input type="text" id="user-sender-name" required placeholder="轉帳帳戶姓名" class="w-full px-3 py-2 border border-[#D7C4B7] rounded-xl text-xs bg-white focus:ring-1 focus:ring-[#967259] focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-[#4A3B32] mb-1">帳號末 5 碼 <span class="text-rose-500">*</span></label>
                            <input type="text" id="user-account-last5" maxlength="5" required placeholder="5碼數字" class="w-full px-3 py-2 border border-[#D7C4B7] rounded-xl text-xs bg-white focus:ring-1 focus:ring-[#967259] focus:outline-none font-mono">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-[#4A3B32] mb-1">實際已轉帳金額 <span class="text-rose-500">*</span></label>
                        <input type="number" id="user-pay-amount" required placeholder="金額" class="w-full px-3 py-2 border border-[#D7C4B7] rounded-xl text-xs bg-white font-bold text-emerald-800 focus:ring-1 focus:ring-[#967259] focus:outline-none">
                    </div>

                    <button type="submit" id="submit-order-btn" class="w-full bg-[#967259] hover:bg-[#634832] text-white py-3 rounded-xl font-bold transition cursor-pointer shadow-sm text-sm">
                        確認並送出代購訂單
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Firebase 模組與邏輯 -->
    <script type="module">
        import * as FirebaseApp from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import * as Firestore from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 已設定為您原專案的 GAS URL
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxqI9ROMLeYSrjDCaNtUfo91zuX4GWkcywJ4lRD5c7a0I6Q7E9KSn5c3edxBS3bsPYVpA/exec";

        const firebaseConfig = {
            apiKey: "AIzaSyBWDdtm4XFr7GRrvWPvndEFczp3o0T5T10",
            authDomain: "skz-0801.firebaseapp.com",
            projectId: "skz-0801",
            storageBucket: "skz-0801.firebasestorage.app",
            messagingSenderId: "520589716798",
            appId: "1:520589716798:web:cfe79151e459a3ffb1106f",
            measurementId: "G-K00NJL3LKJ"
        };

        const app = FirebaseApp.initializeApp(firebaseConfig);
        const db = Firestore.getFirestore(app);

        let products = [];
        let categories = [];
        let cart = [];
        let selectedCategory = 'ALL';
        let allOrdersCache = [];

        const FALLBACK_IMAGE = "data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='200' height='200' viewBox='0 0 24 24' fill='none' stroke='%23d7c4b7' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect width='18' height='18' x='3' y='3' rx='2' ry='2'/%3E%3Ccircle cx='9' cy='9' r='2'/%3E%3Cpath d='m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21'/%3E%3C/svg%3E";

        function convertGoogleDriveUrl(url) {
            if (!url) return '';
            url = url.trim();
            const drivePattern = /\/d\/([a-zA-Z0-9_-]+)/;
            const match = url.match(drivePattern);
            if (match && match[1]) {
                return `https://lh3.googleusercontent.com/d/${match[1]}`;
            }
            return url;
        }

        // 監聽 categories
        Firestore.onSnapshot(Firestore.collection(db, "categories"), (snapshot) => {
            categories = [];
            snapshot.forEach((d) => categories.push({ id: d.id, ...d.data() }));
            renderCategoryFilterBar();
        });

        // 監聽 products
        Firestore.onSnapshot(Firestore.collection(db, "products"), (snapshot) => {
            products = [];
            snapshot.forEach((d) => {
                const data = d.data();
                if (data.active !== false) {
                    if (!data.variants || data.variants.length === 0) {
                        data.variants = [{ name: '標準規格', price: data.price || 0, deposit: data.price || 0, stock: data.stock || 0, maxPerPerson: 0 }];
                    }
                    data.variants.forEach(v => {
                        if (v.deposit === undefined) v.deposit = v.price || 0;
                        if (v.maxPerPerson === undefined) v.maxPerPerson = 0;
                    });
                    let images = Array.isArray(data.images) ? data.images.map(convertGoogleDriveUrl).filter(i => i && i.trim() !== "") : [];
                    data.images = images;
                    products.push({ id: d.id, ...data });
                }
            });
            renderProductGrid();
        });

        // 監聽 settings/bank
        Firestore.onSnapshot(Firestore.doc(db, "settings", "bank"), (docSnap) => {
            if (docSnap.exists()) {
                const b = docSnap.data();
                const container = document.getElementById('bank-accounts-info');
                if (b.accounts && b.accounts.length > 0) {
                    container.innerHTML = b.accounts.map(acc => `<div>• <strong>${acc.name}:</strong> ${acc.account}</div>`).join('');
                }
            }
        });

        // 監聽 orders (供買家個人查詢)
        Firestore.onSnapshot(Firestore.collection(db, "orders"), (snapshot) => {
            allOrdersCache = [];
            snapshot.forEach((d) => allOrdersCache.push({ id: d.id, ...d.data() }));
        });

        function renderCategoryFilterBar() {
            const bar = document.getElementById('category-filter-bar');
            let html = `<button onclick="window.filterByCategory('ALL')" class="category-btn ${selectedCategory === 'ALL' ? 'bg-[#967259] text-white' : 'bg-white text-[#4A3B32] border border-[#D7C4B7]'} px-3.5 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap shadow-sm cursor-pointer transition">全部分類</button>`;
            categories.forEach(c => {
                html += `<button onclick="window.filterByCategory('${c.name}')" class="category-btn ${selectedCategory === c.name ? 'bg-[#967259] text-white' : 'bg-white text-[#4A3B32] border border-[#D7C4B7]'} px-3.5 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap shadow-sm cursor-pointer transition">${c.name}</button>`;
            });
            bar.innerHTML = html;
        }

        window.filterByCategory = function(catName) {
            selectedCategory = catName;
            renderCategoryFilterBar();
            renderProductGrid();
        };

        function renderProductGrid() {
            const grid = document.getElementById('product-grid');
            let list = products;
            if (selectedCategory !== 'ALL') {
                list = list.filter(p => p.category === selectedCategory);
            }

            if (list.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center py-12 text-[#A08D7D] text-sm">目前此分類尚無商品</div>';
                return;
            }

            grid.innerHTML = list.map(p => {
                const imgUrl = p.images && p.images[0] ? p.images[0] : FALLBACK_IMAGE;
                
                const variantOptions = p.variants.map((v, idx) => {
                    const isSoldOut = v.stock <= 0;
                    const limitText = v.maxPerPerson > 0 ? ` (限購${v.maxPerPerson}件)` : '';
                    return `<option value="${idx}" ${isSoldOut ? 'disabled' : ''}>${v.name} - NT$${v.price}${limitText} ${isSoldOut ? '[已售完]' : ''}</option>`;
                }).join('');

                return `
                <div class="bg-white rounded-2xl border border-[#E3D5C5] overflow-hidden shadow-sm flex flex-col">
                    <img src="${imgUrl}" class="w-full h-48 sm:h-56 object-cover bg-amber-50/50 border-b border-[#E3D5C5]">
                    <div class="p-4 flex-grow flex flex-col justify-between space-y-3">
                        <div>
                            <span class="text-[10px] font-bold bg-[#F3E8DB] text-[#4A3B32] border border-[#D7C4B7] px-2 py-0.5 rounded-md">${p.category || '選物'}</span>
                            <h3 class="font-bold text-sm sm:text-base text-[#2C221E] mt-1">${p.name}</h3>
                        </div>
                        <div class="space-y-2">
                            <div>
                                <label class="block text-[11px] font-bold text-[#7D6B5D] mb-1">選擇款式規格：</label>
                                <select id="select-variant-${p.id}" class="w-full px-2.5 py-1.5 border border-[#D7C4B7] rounded-xl text-xs bg-[#FDFBF7] font-bold text-[#2C221E] focus:outline-none">
                                    ${variantOptions}
                                </select>
                            </div>
                            <div class="flex items-center gap-2">
                                <input type="number" id="input-qty-${p.id}" min="1" value="1" class="w-16 px-2 py-1.5 border border-[#D7C4B7] rounded-xl text-xs text-center font-bold bg-[#FDFBF7]">
                                <button onclick="window.addToCart('${p.id}')" class="flex-grow bg-[#967259] hover:bg-[#634832] text-white py-1.5 rounded-xl text-xs font-bold transition shadow-sm cursor-pointer flex items-center justify-center gap-1">
                                    <i class="fa-solid fa-plus"></i> 加入購物車
                                </button>
                            </div>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        window.addToCart = function(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;

            const variantIdx = parseInt(document.getElementById(`select-variant-${productId}`).value);
            const variant = product.variants[variantIdx];
            const qty = parseInt(document.getElementById(`input-qty-${productId}`).value) || 1;

            if (!variant || variant.stock <= 0) return alert('此規格已售完！');

            // 嚴格個人限購檢查
            if (variant.maxPerPerson > 0) {
                const existingInCart = cart.find(item => item.productId === productId && item.variantIdx === variantIdx);
                const currentCartQty = existingInCart ? existingInCart.quantity : 0;
                if ((currentCartQty + qty) > variant.maxPerPerson) {
                    return alert(`【${product.name} - ${variant.name}】每人最多限購 ${variant.maxPerPerson} 件！`);
                }
            }

            const existingIndex = cart.findIndex(item => item.productId === productId && item.variantIdx === variantIdx);
            if (existingIndex > -1) {
                cart[existingIndex].quantity += qty;
            } else {
                cart.push({
                    productId: product.id,
                    name: product.name,
                    category: product.category,
                    variantIdx: variantIdx,
                    variantName: variant.name,
                    price: variant.price,
                    deposit: variant.deposit,
                    quantity: qty
                });
            }

            renderCartUI();
            toggleCartDrawer(true);
        };

        window.toggleCartDrawer = function(forceOpen = false) {
            const drawer = document.getElementById('cart-drawer');
            if (forceOpen) {
                drawer.classList.remove('hidden');
            } else {
                drawer.classList.toggle('hidden');
            }
        };

        function renderCartUI() {
            const container = document.getElementById('cart-items-container');
            const badge = document.getElementById('cart-badge');

            const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            if (totalCount > 0) {
                badge.textContent = totalCount;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }

            if (cart.length === 0) {
                container.innerHTML = '<div class="text-center py-12 text-[#A08D7D] text-xs">購物車目前是空的</div>';
                document.getElementById('cart-total-amount').textContent = 'NT$ 0';
                document.getElementById('cart-deposit-amount').textContent = 'NT$ 0';
                document.getElementById('cart-balance-amount').textContent = 'NT$ 0';
                return;
            }

            let totalAmount = 0;
            let totalDeposit = 0;

            container.innerHTML = cart.map((item, idx) => {
                const itemTotal = item.price * item.quantity;
                const itemDeposit = item.deposit * item.quantity;
                totalAmount += itemTotal;
                totalDeposit += itemDeposit;

                return `
                <div class="bg-white p-3 rounded-xl border border-[#E3D5C5] space-y-1 text-xs">
                    <div class="flex justify-between items-start">
                        <div class="font-bold text-[#2C221E]">[${item.category || '選物'}] ${item.name}</div>
                        <button onclick="window.removeFromCart(${idx})" class="text-rose-500 hover:text-rose-700 font-bold p-0.5 cursor-pointer">&times;</button>
                    </div>
                    <div class="text-[#967259] font-bold">規格：${item.variantName}</div>
                    <div class="flex justify-between items-center pt-1">
                        <div class="flex items-center gap-1.5">
                            <span class="text-[#7D6B5D]">數量：</span>
                            <input type="number" min="1" value="${item.quantity}" onchange="window.updateCartQty(${idx}, this.value)" class="w-12 px-1 py-0.5 border border-[#D7C4B7] rounded text-center font-bold">
                        </div>
                        <div class="text-right">
                            <div class="font-bold text-[#2C221E]">NT$ ${itemTotal}</div>
                            <div class="text-[10px] text-emerald-700 font-bold">預付: NT$ ${itemDeposit}</div>
                        </div>
                    </div>
                </div>`;
            }).join('');

            document.getElementById('cart-total-amount').textContent = `NT$ ${totalAmount.toLocaleString()}`;
            document.getElementById('cart-deposit-amount').textContent = `NT$ ${totalDeposit.toLocaleString()}`;
            document.getElementById('cart-balance-amount').textContent = `NT$ ${(totalAmount - totalDeposit).toLocaleString()}`;
            document.getElementById('user-pay-amount').value = totalDeposit;
        }

        window.updateCartQty = function(idx, val) {
            const newQty = parseInt(val) || 1;
            const item = cart[idx];
            const product = products.find(p => p.id === item.productId);

            if (product && product.variants[item.variantIdx]) {
                const v = product.variants[item.variantIdx];
                if (v.maxPerPerson > 0 && newQty > v.maxPerPerson) {
                    alert(`【${item.name} - ${item.variantName}】每人限購 ${v.maxPerPerson} 件！`);
                    renderCartUI();
                    return;
                }
            }

            cart[idx].quantity = Math.max(1, newQty);
            renderCartUI();
        };

        window.removeFromCart = function(idx) {
            cart.splice(idx, 1);
            renderCartUI();
        };

        // 提交訂單
        document.getElementById('checkout-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            if (cart.length === 0) return alert('購物車是空的，無法送出訂單！');

            const submitBtn = document.getElementById('submit-order-btn');
            submitBtn.disabled = true;
            submitBtn.textContent = '訂單處理中...';

            try {
                const nickname = document.getElementById('user-group-nickname').value.trim();
                const socialAccount = document.getElementById('user-social-account').value.trim();
                const senderName = document.getElementById('user-sender-name').value.trim();
                const last5 = document.getElementById('user-account-last5').value.trim();
                const payAmount = Number(document.getElementById('user-pay-amount').value) || 0;

                let totalAmount = 0;
                let totalDeposit = 0;
                cart.forEach(item => {
                    totalAmount += (item.price * item.quantity);
                    totalDeposit += (item.deposit * item.quantity);
                });

                const now = new Date();
                const orderNo = `STAY-${now.getFullYear()}${(now.getMonth()+1).toString().padStart(2,'0')}${now.getDate().toString().padStart(2,'0')}-${Math.floor(1000 + Math.random() * 9000)}`;

                const orderData = {
                    orderNo: orderNo,
                    groupNickname: nickname,
                    socialAccount: socialAccount,
                    senderName: senderName,
                    accountLastFive: last5,
                    payAmount: payAmount,
                    totalAmount: totalAmount,
                    totalDepositAmount: totalDeposit,
                    totalBalanceAmount: totalAmount - totalDeposit,
                    items: cart,
                    status: '待查帳',
                    createdAt: now.toISOString()
                };

                // 1. 寫入 Firestore 訂單資料庫
                await Firestore.addDoc(Firestore.collection(db, "orders"), orderData);

                // 2. 異步呼叫 GAS 自動發送 Gmail 通知信
                const itemsSummaryText = cart.map(item => 
                    `• [${item.category || '選物'}] ${item.name} (${item.variantName}) x ${item.quantity} (NT$ ${item.price})`
                ).join('\n');

                const emailPayload = {
                    orderNo: orderNo,
                    createdAt: now.toLocaleString(),
                    nickname: nickname,
                    socialAccount: socialAccount,
                    senderName: senderName,
                    accountLastFive: last5,
                    payAmount: payAmount,
                    itemsSummary: itemsSummaryText
                };

                fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(emailPayload)
                }).catch(err => console.error("寄送通知信失敗:", err));

                // 3. 清空購物車與 UI 重置
                cart = [];
                renderCartUI();
                toggleCartDrawer(false);
                document.getElementById('checkout-form').reset();
                alert(`🎉 訂單已成功送出！\n您的訂單編號為：${orderNo}\n您可以使用 LINE 暱稱於上方隨時查詢貨態。`);

            } catch (err) {
                console.error("下單失敗:", err);
                alert('送出訂單時發生錯誤，請稍後再試！');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '確認並送出代購訂單';
            }
        });

        // 買家訂單查詢邏輯
        window.searchCustomerOrders = function() {
            const query = document.getElementById('search-nickname').value.trim().toLowerCase();
            const resultBox = document.getElementById('customer-orders-result');

            if (!query) return alert('請輸入您的 LINE 群組暱稱！');

            const matched = allOrdersCache.filter(o => (o.groupNickname || '').toLowerCase().includes(query));
            resultBox.classList.remove('hidden');

            if (matched.length === 0) {
                resultBox.innerHTML = '<div class="text-xs text-[#A08D7D] py-2">查無相關訂單資料，請確認暱稱是否填寫正確。</div>';
                return;
            }

            resultBox.innerHTML = matched.map(o => `
                <div class="bg-[#F8F4EE] p-3 rounded-xl border border-[#D7C4B7] space-y-1 text-xs">
                    <div class="flex justify-between font-bold text-[#4A3B32]">
                        <span>單號: ${o.orderNo || o.id}</span>
                        <span class="text-[#967259] bg-[#EFE6DC] px-2 py-0.5 rounded-md">${o.status || '待查帳'}</span>
                    </div>
                    <div class="text-[#7D6B5D] text-[11px]">時間: ${o.createdAt ? new Date(o.createdAt).toLocaleString() : '-'}</div>
                    <div class="pt-1 text-[#2C221E]">
                        ${(o.items || []).map(i => `<div>• ${i.name} (${i.variantName}) x ${i.quantity}${i.isOutOfStock ? '<span class="text-rose-500 font-bold">[缺貨]</span>' : ''}</div>`).join('')}
                    </div>
                    <div class="pt-1 flex justify-between font-bold border-t border-[#E3D5C5] text-[#4A3B32]">
                        <span>總價: NT$ ${o.totalAmount || 0}</span>
                        <span class="text-emerald-800">實匯: NT$ ${o.payAmount || 0}</span>
                    </div>
                </div>
            `).join('');
        };
    </script>
</body>
</html>
